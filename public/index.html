<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m.flashallscores.com</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="header">
  <a class="brand" href="/" aria-label="FLASHALLSCORES">
    <span class="brand-mark" aria-hidden="true">&#9889;</span>
    <span>FLASHALLSCORES</span>
    <span class="live-badge">LIVE</span>
  </a>
  <div class="header-actions" aria-label="Actions">
    <button type="button" aria-label="Rechercher">&#128269;</button>
    <button type="button" aria-label="Notifications">&#128276;</button>
    <button type="button" aria-label="Parametres">&#9881;</button>
  </div>
</header>
<div class="top-menu">
  <button data-filter="today" class="active">AUJOURD'HUI</button>
  <button class="live-tab" data-filter="live"><span class="live-dot" aria-hidden="true"></span>EN DIRECT</button>
  <button data-filter="finished">TERMINÉS</button>
  <button data-filter="tomorrow">DEMAIN</button>
  <button data-filter="yesterday">HIER</button>
  <button data-filter="cotes">COTES</button>
  <a class="top-link" href="/classements.html">CLASSEMENTS</a>
</div>
<main id="list" class="fixtures-list">Chargement...</main>

<script>
const list = document.getElementById('list');
const blockedLeaguePattern = /srl|esoccer/i;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  }[character]));
}

function matchTime(match) {
  const status = match.fixture?.status?.short;
  if (['FT', 'AET', 'PEN'].includes(status)) return 'FT';
  if (['1H', '2H', 'ET'].includes(status)) {
    return `${match.fixture.status.elapsed || status}'`;
  }
  if (status === 'HT') return 'MT';
  return new Date(match.fixture?.date).toLocaleTimeString('fr-FR', {
    timeZone: 'Africa/Kinshasa',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function matchScore(match) {
  const home = match.goals?.home;
  const away = match.goals?.away;
  return home === null || home === undefined || away === null || away === undefined
    ? '-'
    : `${home}-${away}`;
}

function renderMatches(fixtures) {
  const groups = new Map();
  fixtures
    .filter(match => !blockedLeaguePattern.test(match.league?.name || ''))
    .forEach(match => {
      const country = match.league?.country || 'Monde';
      const name = match.league?.name || 'Championnat inconnu';
      const key = `${country}::${name}`;
      if (!groups.has(key)) groups.set(key, { country, name, matches: [] });
      groups.get(key).matches.push(match);
    });

  if (groups.size === 0) {
    list.textContent = 'Aucun match - vérifie /api/matches';
    return;
  }

  list.innerHTML = [...groups.values()].map(group => `
    <section class="league-group">
      <div class="league-header">
        <span class="league-country">${escapeHtml(group.country)}</span>
        <span>${escapeHtml(group.country)} - ${escapeHtml(group.name)}</span>
      </div>
      ${group.matches.map(match => `
        <div class="match-row" data-fixture-id="${escapeHtml(match.fixture?.id || '')}">
          <div class="match-time">${escapeHtml(matchTime(match))}</div>
          <div class="match-teams">
            <div><span>${escapeHtml(match.teams?.home?.name || 'Equipe inconnue')}</span></div>
            <div><span>${escapeHtml(match.teams?.away?.name || 'Equipe inconnue')}</span></div>
          </div>
          <div class="match-score">${escapeHtml(matchScore(match))}</div>
        </div>`).join('')}
    </section>`).join('');

  list.querySelectorAll('.match-row[data-fixture-id]').forEach(row => {
    row.addEventListener('click', () => {
      window.location.href = `/match/${encodeURIComponent(row.dataset.fixtureId)}`;
    });
  });
}

async function loadMatches() {
  try {
    const res = await fetch('/api/matches');
    const data = await res.json();
    if (!res.ok || data?.error) throw new Error(data?.error || 'Erreur API');

    const groups = data.response || data || [];
    const matches = Array.isArray(groups)
      ? groups.flatMap(group => Array.isArray(group.matches) ? group.matches : [group])
      : [];

    console.log('matches.length:', matches.length);
    if (!matches.length) {
      document.body.innerHTML += '<pre>' + JSON.stringify(data).slice(0, 500) + '</pre>';
    }

    renderMatches(matches);
  } catch (error) {
    list.textContent = error.message || 'Erreur API';
  }
}

loadMatches();
</script>
</body>
</html>
